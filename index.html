<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F2F2F7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="DSM-5">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DSM-5">
    <link rel="apple-touch-icon" href="logo.png">
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">

    <title>DSM-5 Rehberi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #F2F2F7; 
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --accent-color: #007AFF; 
            --border-color: #E5E5EA;
            --badge-bg: #E5F1FF;
            --badge-text: #007AFF;
        }
        
        /* Genel Optimizasyonlar ve Native Hissiyat */
        * {
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 15px; 
            line-height: 1.5; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation; 
            -webkit-overflow-scrolling: touch; 
        }
        
        .container { max-width: 760px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--text-main); margin-bottom: 6px; font-size: 28px; font-weight: 700; letter-spacing: -0.8px; }
        .subtitle { color: var(--text-muted); font-size: 15px; font-weight: 400; }
        
        /* Arama Çubuğu */
        .search-container { position: sticky; top: 15px; z-index: 100; margin-bottom: 25px; }
        .search-box { 
            width: 100%; 
            padding: 16px 22px; 
            font-size: 16px; 
            border: none; 
            border-radius: 20px; 
            background-color: var(--card-bg); 
            color: var(--text-main); 
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            transition: box-shadow 0.2s ease; 
            appearance: none;
        }
        .search-box:focus { 
            outline: none; 
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.15); 
        }
        .search-box::placeholder { color: #A1A1A6; }
        
        /* Ana Kategori Akordeon */
        .accordion-item { 
            background: var(--card-bg); 
            border-radius: 16px; 
            margin-bottom: 14px; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03); 
            overflow: hidden; 
            border: 1px solid rgba(0,0,0,0.03);
            transform: translateZ(0); /* Donanım Hızlandırma */
            will-change: transform;
        }
        .accordion-header { 
            padding: 18px 22px; 
            font-weight: 600; 
            font-size: 17px; 
            color: var(--text-main); 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            user-select: none; 
        }
        .accordion-icon { 
            font-size: 24px; 
            color: var(--accent-color); 
            transition: transform 0.25s cubic-bezier(0.4, 0.0, 0.2, 1); 
            font-weight: 400; 
        }
        .accordion-content { display: none; padding: 0 20px 20px 20px; }
        .accordion-item.active .accordion-content { display: block; }
        .accordion-item.active .accordion-header { border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
        
        /* Alt Tanı Kartları */
        .tani-card { 
            background: #FAFAFC; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            margin-bottom: 10px; 
            overflow: hidden; 
            transform: translateZ(0);
        }
        .tani-card:last-child { margin-bottom: 0; }
        
        .tani-header { 
            padding: 15px 18px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            user-select: none; 
        }
        .tani-baslik-container { display: flex; flex-direction: column; gap: 6px; }
        .tani-baslik { font-size: 15px; color: var(--text-main); margin: 0; font-weight: 600; letter-spacing: -0.2px; }
        .kod-badge { 
            background-color: var(--badge-bg); 
            color: var(--badge-text); 
            padding: 3px 8px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 600; 
            align-self: flex-start; 
        }
        .tani-icon { 
            font-size: 18px; 
            color: var(--text-muted); 
            transition: transform 0.25s cubic-bezier(0.4, 0.0, 0.2, 1); 
            margin-top: 2px; 
        }
        
        .tani-content { display: none; padding: 0 18px 18px 18px; }
        .tani-card.active { background: var(--card-bg); border-color: #D1D1D6; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .tani-card.active .tani-content { display: block; }
        .tani-card.active .tani-icon { color: var(--accent-color); }
        
        /* Kriter Metinleri */
        .kriter-harf { font-weight: 700; color: var(--accent-color); margin-right: 5px; }
        .kriter-tanim { font-weight: 500; margin-bottom: 4px; margin-top: 12px; color: var(--text-main); font-size: 15px; }
        ul.kriter-liste { margin-top: 4px; padding-left: 20px; color: #48484A; font-size: 14.5px; }
        ul.kriter-liste li { margin-bottom: 4px; }
        
        /* Durum Sınıfları */
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 15px; font-weight: 500; }
        .error-msg { color: #FF3B30; text-align: center; padding: 20px; font-weight: 500; background: #FFE5E5; border-radius: 12px; font-size: 14px; }

        /* Mobil Ekran Daraltmaları (Compact View) */
        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            h1 { font-size: 24px; }
            .accordion-header { padding: 15px 18px; font-size: 16px; }
            .tani-header { padding: 12px 14px; }
            .tani-baslik { font-size: 14.5px; }
            .search-box { padding: 14px 18px; font-size: 15px; }
            .kriter-tanim { font-size: 14.5px; }
            ul.kriter-liste { font-size: 14px; padding-left: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DSM-5</h1>
        <div class="subtitle">Klinik Tanı Ölçütleri Portalı</div>
    </header>

    <div class="search-container">
        <input type="search" id="searchInput" class="search-box" autocomplete="off" placeholder="Tanı adı veya F kodu arayın...">
    </div>

    <div id="dsmContainer">
        <div class="loading">Veriler yükleniyor...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://hxahdcetnqcwzhkhqoey.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4YWhkY2V0bnFjd3poa2hxb2V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzUxNzYsImV4cCI6MjEwMzg1MTE3Nn0.6XcAk3fvN9h1nwyj2YLNSarpr9YZEGcRhwkgQRZty5A';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", () => {
        fetchDSMData();
        setupSearch();
    });

    async function fetchDSMData() {
        try {
            const { data, error } = await supabaseClient
                .from('dsm_kategoriler')
                .select('*')
                .order('id', { ascending: true });

            if (error) throw error;
            
            if (data && data.length > 0) {
                renderUI(data);
            } else {
                document.getElementById('dsmContainer').innerHTML = '<div class="loading">Veritabanında kayıt bulunamadı.</div>';
            }
        } catch (error) {
            console.error('Veri çekme hatası:', error.message);
            document.getElementById('dsmContainer').innerHTML = `<div class="error-msg">Bağlantı Hatası: ${error.message}</div>`;
        }
    }

    function renderUI(data) {
        const container = document.getElementById('dsmContainer');
        // DOM işlemlerini hızlandırmak için DocumentFragment kullanımı
        const fragment = document.createDocumentFragment();

        data.forEach(kategori => {
            const accItem = document.createElement('div');
            accItem.className = 'accordion-item'; 

            let tanilarHTML = '';
            
            if(kategori.tanilar && Array.isArray(kategori.tanilar)) {
                kategori.tanilar.forEach(tani => {
                    let kriterlerHTML = tani.kriterler.map(k => `
                        <div>
                            <div class="kriter-tanim">${k.harf !== 'Not' ? `<span class="kriter-harf">${k.harf}.</span>` : `<span class="kriter-harf">Not.</span>`} ${k.tanim}</div>
                            ${k.maddeler && k.maddeler.length > 0 ? `<ul class="kriter-liste">${k.maddeler.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}
                        </div>
                    `).join('');

                    tanilarHTML += `
                        <div class="tani-card" data-search="${tani.baslik.toLowerCase()} ${tani.kod_icd10.toLowerCase()}">
                            <div class="tani-header">
                                <div class="tani-baslik-container">
                                    <h3 class="tani-baslik">${tani.baslik}</h3>
                                    <div class="kod-badge">${tani.kod_icd10}</div>
                                </div>
                                <span class="tani-icon">+</span>
                            </div>
                            <div class="tani-content">
                                ${kriterlerHTML}
                            </div>
                        </div>
                    `;
                });
            }

            accItem.innerHTML = `
                <div class="accordion-header">
                    <span>${kategori.kategori_adi}</span>
                    <span class="accordion-icon" style="transform: rotate(0deg);">+</span>
                </div>
                <div class="accordion-content">
                    ${tanilarHTML}
                </div>
            `;
            fragment.appendChild(accItem);
        });
        
        container.innerHTML = '';
        container.appendChild(fragment);

        document.querySelectorAll('.accordion-header').forEach(header => {
            header.addEventListener('click', function() {
                const item = this.parentElement;
                item.classList.toggle('active');
                const icon = this.querySelector('.accordion-icon');
                icon.textContent = item.classList.contains('active') ? '−' : '+';
                icon.style.transform = item.classList.contains('active') ? 'rotate(180deg)' : 'rotate(0)';
            });
        });

        document.querySelectorAll('.tani-header').forEach(header => {
            header.addEventListener('click', function(e) {
                e.stopPropagation(); 
                const card = this.parentElement;
                card.classList.toggle('active');
                const icon = this.querySelector('.tani-icon');
                icon.textContent = card.classList.contains('active') ? '−' : '+';
                icon.style.transform = card.classList.contains('active') ? 'rotate(180deg)' : 'rotate(0)';
            });
        });
    }

    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        
        searchInput.addEventListener('input', (e) => {
            // requestAnimationFrame ile aramayı boyama döngüsüne senkronize ederek performansı artırıyoruz
            requestAnimationFrame(() => {
                const query = e.target.value.toLowerCase().trim();
                const accordions = document.querySelectorAll('.accordion-item');

                accordions.forEach(acc => {
                    const tanilar = acc.querySelectorAll('.tani-card');
                    let hasVisibleCard = false;

                    tanilar.forEach(card => {
                        const searchableText = card.getAttribute('data-search');
                        
                        if (query === '') {
                            card.classList.remove('hidden', 'active');
                            card.querySelector('.tani-icon').textContent = '+';
                            card.querySelector('.tani-icon').style.transform = 'rotate(0deg)';
                        } else if (searchableText.includes(query)) {
                            card.classList.remove('hidden');
                            card.classList.add('active'); 
                            card.querySelector('.tani-icon').textContent = '−';
                            card.querySelector('.tani-icon').style.transform = 'rotate(180deg)';
                            hasVisibleCard = true;
                        } else {
                            card.classList.add('hidden');
                            card.classList.remove('active');
                            card.querySelector('.tani-icon').textContent = '+';
                            card.querySelector('.tani-icon').style.transform = 'rotate(0deg)';
                        }
                    });

                    if (query === '') {
                        acc.classList.remove('hidden', 'active');
                        acc.querySelector('.accordion-icon').textContent = '+';
                        acc.querySelector('.accordion-icon').style.transform = 'rotate(0deg)';
                    } else if (hasVisibleCard) {
                        acc.classList.remove('hidden');
                        acc.classList.add('active'); 
                        acc.querySelector('.accordion-icon').textContent = '−';
                        acc.querySelector('.accordion-icon').style.transform = 'rotate(180deg)';
                    } else {
                        acc.classList.add('hidden');
                        acc.classList.remove('active');
                    }
                });
            });
        });
    }
</script>
</body>
</html>
