<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F2F4F8" id="themeColorMeta">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="DSM-5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DSM-5">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <title>DSM-5 Klinik Karar Destek Sistemi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #F2F4F8;
            --card-bg: #FFFFFF;
            --card-sub-bg: #F8FAFC;
            --text-main: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            --accent-color: #0284C7;
            --accent-soft: #E0F2FE;
            --border-color: #E2E8F0;
            --search-bg: rgba(255, 255, 255, 0.85);
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.07);
            
            /* Tedavi Algoritması Renkleri (Açık Tema) */
            --green-bg: #F0FDF4;
            --green-border: #22C55E;
            --green-text: #15803D;
            
            --yellow-bg: #FEFCE8;
            --yellow-border: #EAB308;
            --yellow-text: #A16207;
            
            --red-bg: #FEF2F2;
            --red-border: #EF4444;
            --red-text: #B91C1C;
        }

        [data-theme="dark"] {
            --bg-color: #0B0F19;
            --card-bg: #151C2C;
            --card-sub-bg: #1E293B;
            --text-main: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --accent-color: #38BDF8;
            --accent-soft: rgba(56, 189, 248, 0.15);
            --border-color: #26334D;
            --search-bg: rgba(21, 28, 44, 0.85);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);

            /* Tedavi Algoritması Renkleri (Koyu Tema) */
            --green-bg: rgba(34, 197, 94, 0.1);
            --green-border: #22C55E;
            --green-text: #4ADE80;
            
            --yellow-bg: rgba(234, 179, 8, 0.1);
            --yellow-border: #EAB308;
            --yellow-text: #FACC15;
            
            --red-bg: rgba(239, 68, 68, 0.1);
            --red-border: #EF4444;
            --red-text: #F87171;
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px 60px 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* Üst Bar & Başlık */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #94A3B8;
        }
        .status-dot.online { background-color: #22C55E; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }
        .status-dot.offline { background-color: #F59E0B; box-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }

        .top-actions { display: flex; gap: 8px; }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform 0.15s ease, background-color 0.2s;
        }
        .icon-btn:active { transform: scale(0.93); }

        header { text-align: center; margin-bottom: 24px; }
        
        .brand-badge {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--accent-color);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            letter-spacing: 0.4px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 14.5px;
            font-weight: 500;
        }

        /* Arama ve Filtre Alanı */
        .search-container {
            position: sticky;
            top: 12px;
            z-index: 100;
            margin-bottom: 20px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-box {
            width: 100%;
            padding: 16px 46px 16px 48px;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            background-color: var(--search-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
            appearance: none;
        }
        
        .search-box::placeholder { color: var(--text-muted); font-weight: 400; }
        .search-box:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 8px 28px rgba(2, 132, 199, 0.18);
        }

        .clear-btn {
            position: absolute;
            right: 14px;
            background: var(--border-color);
            color: var(--text-muted);
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .text-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .text-btn:hover { background: var(--accent-soft); }

        /* Ana Kategori Akordeonları */
        .accordion-item {
            background: var(--card-bg);
            border-radius: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .accordion-item.active {
            border-color: rgba(2, 132, 199, 0.35);
            box-shadow: var(--shadow-md);
        }

        .accordion-header {
            padding: 18px 20px;
            font-weight: 700;
            font-size: 16.5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            gap: 12px;
        }

        .kategori-sol {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .kategori-sayi {
            background: var(--card-sub-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .chevron-icon {
            width: 20px;
            height: 20px;
            color: var(--accent-color);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .accordion-content {
            display: none;
            padding: 4px 16px 18px 16px;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
        }
        
        .accordion-item.active .accordion-content { display: block; }
        .accordion-item.active .accordion-header .chevron-icon { transform: rotate(180deg); }

        /* Tanı Kartları */
        .tani-card {
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-top: 10px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .tani-header {
            padding: 14px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            gap: 12px;
        }

        .tani-baslik-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .tani-baslik {
            font-size: 15px;
            margin: 0;
            font-weight: 650;
            color: var(--text-main);
            letter-spacing: -0.2px;
        }

        .kod-badge {
            background-color: var(--accent-soft);
            color: var(--accent-color);
            padding: 3px 9px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .tedavi-var-rozet {
            background-color: var(--green-bg);
            color: var(--green-text);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .tani-content {
            display: none;
            padding: 4px 16px 18px 16px;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        .tani-card.active {
            background: var(--card-bg);
            border-color: var(--accent-color);
            box-shadow: var(--shadow-sm);
        }
        .tani-card.active .tani-content { display: block; }
        .tani-card.active .tani-header .chevron-icon { transform: rotate(180deg); color: var(--accent-color); }

        /* Tanı Kriterleri */
        .kriter-satir {
            margin-top: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .kriter-satir:last-of-type { border-bottom: none; padding-bottom: 4px; }

        .kriter-tanim {
            font-weight: 500;
            font-size: 14.5px;
            color: var(--text-main);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .kriter-harf {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 26px;
            height: 26px;
            padding: 0 6px;
            background: var(--accent-soft);
            color: var(--accent-color);
            font-weight: 800;
            font-size: 13px;
            border-radius: 7px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        ul.kriter-liste {
            margin: 8px 0 0 36px;
            padding: 0;
            list-style: none;
            color: var(--text-secondary);
            font-size: 14px;
        }

        ul.kriter-liste li {
            position: relative;
            padding-left: 14px;
            margin-bottom: 6px;
        }

        ul.kriter-liste li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent-color);
            font-weight: bold;
        }

        /* Tedavi Algoritması Bölümü */
        .tedavi-accordion {
            margin-top: 16px;
            border-top: 1px dashed var(--border-color);
            padding-top: 14px;
        }

        .tedavi-header {
            padding: 13px 16px;
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-weight: 700;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-size: 14.5px;
            transition: background-color 0.2s;
        }
        
        .tedavi-header:hover { background: var(--accent-soft); }
        .tedavi-header-sol { display: flex; align-items: center; gap: 8px; }
        .tedavi-content { display: none; padding: 14px 2px 4px 2px; }
        .tedavi-accordion.active .tedavi-content { display: block; }
        .tedavi-accordion.active .tedavi-header .chevron-icon { transform: rotate(180deg); }

        .tedavi-blok {
            margin-bottom: 12px;
            padding: 12px 14px;
            border-left: 4px solid #ccc;
            border-radius: 6px 12px 12px 6px;
        }
        .tedavi-blok:last-child { margin-bottom: 0; }

        .tedavi-blok.border-yesil {
            border-left-color: var(--green-border);
            background: var(--green-bg);
        }
        .tedavi-blok.border-sari {
            border-left-color: var(--yellow-border);
            background: var(--yellow-bg);
        }
        .tedavi-blok.border-kirmizi {
            border-left-color: var(--red-border);
            background: var(--red-bg);
        }

        .tedavi-blok-baslik {
            font-size: 14px;
            font-weight: 750;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tedavi-blok.border-yesil .tedavi-blok-baslik { color: var(--green-text); }
        .tedavi-blok.border-sari .tedavi-blok-baslik { color: var(--yellow-text); }
        .tedavi-blok.border-kirmizi .tedavi-blok-baslik { color: var(--red-text); }

        ul.tedavi-liste {
            margin: 0;
            padding-left: 18px;
            font-size: 13.8px;
            color: var(--text-main);
        }
        ul.tedavi-liste li { margin-bottom: 5px; }
        ul.tedavi-liste li:last-child { margin-bottom: 0; }

        .hidden { display: none !important; }
        
        .loading, .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
            background: var(--card-bg);
            border-radius: 18px;
            border: 1px solid var(--border-color);
        }

        footer {
            text-align: center;
            margin-top: 36px;
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px 50px 12px; }
            h1 { font-size: 25px; }
            .accordion-header { padding: 15px 16px; font-size: 15.5px; }
            .tani-header { padding: 12px 14px; }
            .tani-baslik { font-size: 14.5px; }
            .search-box { padding: 14px 40px 14px 44px; font-size: 15px; }
            ul.kriter-liste { margin-left: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Üst Durum ve Araç Çubuğu -->
    <div class="top-bar">
        <div class="status-pill" id="statusPill" title="Veritabanı Bağlantı Durumu">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Kontrol ediliyor...</span>
        </div>
        <div class="top-actions">
            <button class="icon-btn" id="exportBtn" title="Veritabanını JSON Olarak Yedekle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button class="icon-btn" id="themeToggle" title="Gece / Gündüz Modu">
                <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </div>

    <header>
        <div class="brand-badge">Klinik Karar Destek Sistemi</div>
        <h1>DSM-5 Rehberi</h1>
        <div class="subtitle">Tanı Ölçütleri & Pediatrik Tedavi Algoritmaları</div>
    </header>

    <div class="search-container">
        <div class="search-wrapper">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="searchInput" class="search-box" autocomplete="off" placeholder="Tanı adı, ICD-10 kodu (örn. F90) veya etken madde ara...">
            <button class="clear-btn" id="clearSearchBtn" title="Temizle">✕</button>
        </div>
    </div>

    <div class="toolbar">
        <span id="statsCounter">Yükleniyor...</span>
        <button class="text-btn" id="collapseAllBtn">Tümünü Daralt</button>
    </div>

    <div id="dsmContainer">
        <div class="loading">Klinik veritabanı hazırlanıyor...</div>
    </div>

    <footer>
        Klinik pratikte hekim kararını desteklemek amacıyla tasarlanmıştır.
    </footer>
</div>

<script>
    const SUPABASE_URL = 'https://hxahdcetnqcwzhkhqoey.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4YWhkY2V0bnFjd3poa2hxb2V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzUxNzYsImV4cCI6MjEwMzg1MTE3Nn0.6XcAk3fvN9h1nwyj2YLNSarpr9YZEGcRhwkgQRZty5A';
    const STORAGE_KEY = 'dsm5_klinik_veritabani_v2';
    const STORAGE_TIME_KEY = 'dsm5_son_guncelleme';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentData = [];

    const CHEVRON_SVG = `<svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

    document.addEventListener("DOMContentLoaded", () => {
        initTheme();
        loadDataWithFallback();
        setupSearch();
        setupToolbarActions();
    });

    // Türkçe Karakter Duyarlı Normalizasyon
    function normalizeTR(text) {
        if (!text) return '';
        return text
            .toLocaleLowerCase('tr-TR')
            .replace(/ğ/g, 'g')
            .replace(/ü/g, 'u')
            .replace(/ş/g, 's')
            .replace(/ı/g, 'i')
            .replace(/ö/g, 'o')
            .replace(/ç/g, 'c');
    }

    // 1. Önbellek + Canlı Veritabanı Senkronizasyonu (Pause & Offline Koruması)
    async function loadDataWithFallback() {
        const cachedRaw = localStorage.getItem(STORAGE_KEY);
        const cachedTime = localStorage.getItem(STORAGE_TIME_KEY);

        // Önce hafızada veri varsa anında ekrana bas (Sıfır bekleme)
        if (cachedRaw) {
            try {
                currentData = JSON.parse(cachedRaw);
                renderUI(currentData);
                updateStatus('offline', `Hafızadan yüklendi (${cachedTime || 'Önbellek'})`);
            } catch (e) {
                console.error("Önbellek okuma hatası:", e);
            }
        }

        // Ardından arka planda Supabase'den güncel veriyi çek ve projeyi uyanık tut
        try {
            const { data, error } = await supabaseClient
                .from('dsm_kategoriler')
                .select('*')
                .order('id', { ascending: true });

            if (error) throw error;

            if (data && data.length > 0) {
                currentData = data;
                const nowStr = new Date().toLocaleDateString('tr-TR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                localStorage.setItem(STORAGE_TIME_KEY, nowStr);
                
                // Eğer önbellek yoksa veya yeni veri farklıysa ekranı güncelle
                if (!cachedRaw || cachedRaw !== JSON.stringify(data)) {
                    renderUI(data);
                }
                updateStatus('online', 'Çevrimiçi & Senkronize');
            }
        } catch (error) {
            console.warn("Supabase bağlantı uyarısı:", error.message);
            if (!cachedRaw) {
                document.getElementById('dsmContainer').innerHTML = `
                    <div class="empty-state">
                        <div style="font-size:28px; margin-bottom:8px;">⚠️</div>
                        <div>Sunucuya ulaşılamadı ve cihazda kayıtlı çevrimdışı yedek bulunamadı.</div>
                        <div style="font-size:13px; margin-top:6px;">Hata: ${error.message}</div>
                    </div>`;
            } else {
                updateStatus('offline', `Çevrimdışı Mod (Yedek: ${cachedTime || 'Aktif'})`);
            }
        }
    }

    function updateStatus(state, message) {
        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        dot.className = 'status-dot ' + state;
        text.textContent = message;
    }

    // 2. Arayüzü Oluşturma
    function renderUI(data) {
        const container = document.getElementById('dsmContainer');
        const fragment = document.createDocumentFragment();
        let totalDiagnoses = 0;

        data.forEach(kategori => {
            const accItem = document.createElement('div');
            accItem.className = 'accordion-item';

            let tanilarHTML = '';
            const taniListesi = Array.isArray(kategori.tanilar) ? kategori.tanilar : [];
            totalDiagnoses += taniListesi.length;

            taniListesi.forEach(tani => {
                // Kriterleri oluştur
                let kriterlerHTML = (tani.kriterler || []).map(k => `
                    <div class="kriter-satir">
                        <div class="kriter-tanim">
                            <span class="kriter-harf">${k.harf}</span>
                            <span>${k.tanim}</span>
                        </div>
                        ${k.maddeler && k.maddeler.length > 0 ? `<ul class="kriter-liste">${k.maddeler.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}
                    </div>
                `).join('');

                // Tedavi şeması varsa oluştur
                let tedaviHTML = '';
                const hasTedavi = tani.tedavi_algoritmasi && tani.tedavi_algoritmasi.length > 0;
                let tedaviAramaMetni = '';

                if (hasTedavi) {
                    tedaviAramaMetni = tani.tedavi_algoritmasi.map(t => `${t.baslik} ${(t.maddeler || []).join(' ')}`).join(' ');
                    
                    let tedaviBloklari = tani.tedavi_algoritmasi.map(t => `
                        <div class="tedavi-blok border-${t.renk_kodu}">
                            <div class="tedavi-blok-baslik">${t.baslik}</div>
                            <ul class="tedavi-liste">
                                ${t.maddeler.map(m => `<li>${m}</li>`).join('')}
                            </ul>
                        </div>
                    `).join('');

                    tedaviHTML = `
                        <div class="tedavi-accordion">
                            <div class="tedavi-header">
                                <div class="tedavi-header-sol">
                                    <span>💊</span>
                                    <span>Klinik Tedavi Algoritması</span>
                                </div>
                                ${CHEVRON_SVG}
                            </div>
                            <div class="tedavi-content">
                                ${tedaviBloklari}
                            </div>
                        </div>
                    `;
                }

                const rawSearchText = `${tani.baslik} ${tani.kod_icd10} ${tedaviAramaMetni}`;
                const normalizedSearch = normalizeTR(rawSearchText);

                tanilarHTML += `
                    <div class="tani-card" data-search="${normalizedSearch}">
                        <div class="tani-header">
                            <div class="tani-baslik-container">
                                <h3 class="tani-baslik">${tani.baslik}</h3>
                                <span class="kod-badge">${tani.kod_icd10}</span>
                                ${hasTedavi ? `<span class="tedavi-var-rozet">Tedavi Şemalı</span>` : ''}
                            </div>
                            ${CHEVRON_SVG}
                        </div>
                        <div class="tani-content">
                            ${kriterlerHTML}
                            ${tedaviHTML}
                        </div>
                    </div>
                `;
            });

            accItem.innerHTML = `
                <div class="accordion-header">
                    <div class="kategori-sol">
                        <span>${kategori.kategori_adi}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="kategori-sayi">${taniListesi.length} tanı</span>
                        ${CHEVRON_SVG}
                    </div>
                </div>
                <div class="accordion-content">
                    ${tanilarHTML}
                </div>
            `;
            fragment.appendChild(accItem);
        });

        container.innerHTML = '';
        container.appendChild(fragment);

        document.getElementById('statsCounter').textContent = `${data.length} Kategori • ${totalDiagnoses} Tanı`;

        // Event Listener'lar
        document.querySelectorAll('.accordion-header').forEach(header => {
            header.addEventListener('click', function() {
                this.parentElement.classList.toggle('active');
            });
        });

        document.querySelectorAll('.tani-header').forEach(header => {
            header.addEventListener('click', function(e) {
                e.stopPropagation();
                this.parentElement.classList.toggle('active');
            });
        });

        document.querySelectorAll('.tedavi-header').forEach(header => {
            header.addEventListener('click', function(e) {
                e.stopPropagation();
                this.parentElement.classList.toggle('active');
            });
        });
    }

    // 3. Arama Motoru
    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearchBtn');

        const performSearch = () => {
            const rawQuery = searchInput.value.trim();
            const query = normalizeTR(rawQuery);
            clearBtn.style.display = rawQuery.length > 0 ? 'flex' : 'none';

            const accordions = document.querySelectorAll('.accordion-item');

            accordions.forEach(acc => {
                const tanilar = acc.querySelectorAll('.tani-card');
                let hasVisibleCard = false;

                tanilar.forEach(card => {
                    const searchableText = card.getAttribute('data-search');
                    if (query === '') {
                        card.classList.remove('hidden', 'active');
                    } else if (searchableText.includes(query)) {
                        card.classList.remove('hidden');
                        card.classList.add('active');
                        hasVisibleCard = true;
                    } else {
                        card.classList.add('hidden');
                        card.classList.remove('active');
                    }
                });

                if (query === '') {
                    acc.classList.remove('hidden', 'active');
                } else if (hasVisibleCard) {
                    acc.classList.remove('hidden');
                    acc.classList.add('active');
                } else {
                    acc.classList.add('hidden');
                    acc.classList.remove('active');
                }
            });
        };

        searchInput.addEventListener('input', () => requestAnimationFrame(performSearch));
        
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            performSearch();
            searchInput.focus();
        });
    }

    // 4. Gece Modu ve Araçlar
    function initTheme() {
        const savedTheme = localStorage.getItem('dsm5_theme') || 'light';
        applyTheme(savedTheme);

        document.getElementById('themeToggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            localStorage.setItem('dsm5_theme', next);
        });
    }

    function applyTheme(theme) {
        const metaTheme = document.getElementById('themeColorMeta');
        const icon = document.getElementById('themeIcon');
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            metaTheme.setAttribute('content', '#0B0F19');
            icon.innerHTML = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
        } else {
            document.documentElement.removeAttribute('data-theme');
            metaTheme.setAttribute('content', '#F2F4F8');
            icon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
        }
    }

    function setupToolbarActions() {
        // Tümünü Daralt
        document.getElementById('collapseAllBtn').addEventListener('click', () => {
            document.querySelectorAll('.accordion-item.active, .tani-card.active, .tedavi-accordion.active').forEach(el => {
                el.classList.remove('active');
            });
        });

        // JSON Yedek İndir
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (!currentData || currentData.length === 0) return;
            const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dsm5_klinik_yedek_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });
    }
</script>
