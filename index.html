<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F2F2F7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="DSM-5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="DSM-5">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <title>DSM-5 Rehberi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #F2F2F7; 
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --accent-color: #007AFF; 
            --border-color: #E5E5EA;
            --badge-bg: #E5F1FF;
            --badge-text: #007AFF;
        }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 40px 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; touch-action: manipulation; -webkit-overflow-scrolling: touch; }
        .container { max-width: 760px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin-bottom: 6px; font-size: 28px; font-weight: 700; letter-spacing: -0.8px; }
        .subtitle { color: var(--text-muted); font-size: 15px; font-weight: 400; }
        
        .search-container { position: sticky; top: 15px; z-index: 100; margin-bottom: 25px; }
        .search-box { width: 100%; padding: 16px 22px; font-size: 16px; border: none; border-radius: 20px; background-color: var(--card-bg); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05); transition: box-shadow 0.2s ease; appearance: none; }
        .search-box:focus { outline: none; box-shadow: 0 4px 20px rgba(0, 122, 255, 0.15); }
        
        .accordion-item { background: var(--card-bg); border-radius: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03); overflow: hidden; border: 1px solid rgba(0,0,0,0.03); transform: translateZ(0); }
        .accordion-header { padding: 18px 22px; font-weight: 600; font-size: 17px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .accordion-icon { font-size: 24px; color: var(--accent-color); transition: transform 0.25s cubic-bezier(0.4, 0.0, 0.2, 1); }
        .accordion-content { display: none; padding: 0 20px 20px 20px; }
        .accordion-item.active .accordion-content { display: block; }
        .accordion-item.active .accordion-header { border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
        
        .tani-card { background: #FAFAFC; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 10px; overflow: hidden; transform: translateZ(0); }
        .tani-header { padding: 15px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; user-select: none; }
        .tani-baslik-container { display: flex; flex-direction: column; gap: 6px; }
        .tani-baslik { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.2px; }
        .kod-badge { background-color: var(--badge-bg); color: var(--badge-text); padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; align-self: flex-start; }
        .tani-icon { font-size: 18px; color: var(--text-muted); transition: transform 0.25s cubic-bezier(0.4, 0.0, 0.2, 1); margin-top: 2px; }
        .tani-content { display: none; padding: 0 18px 18px 18px; }
        .tani-card.active { background: var(--card-bg); border-color: #D1D1D6; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .tani-card.active .tani-content { display: block; }
        .tani-card.active .tani-icon { color: var(--accent-color); }
        
        .kriter-harf { font-weight: 700; color: var(--accent-color); margin-right: 5px; }
        .kriter-tanim { font-weight: 500; margin-bottom: 4px; margin-top: 12px; font-size: 15px; }
        ul.kriter-liste { margin-top: 4px; padding-left: 20px; color: #48484A; font-size: 14.5px; }
        ul.kriter-liste li { margin-bottom: 4px; }
        
        /* ---------------- YENİ EKLENEN TEDAVİ STİLLERİ ---------------- */
        .tedavi-accordion { margin-top: 20px; border-top: 1px dashed #C7C7CC; padding-top: 15px; }
        .tedavi-header { padding: 12px 16px; background: #F2F2F7; border-radius: 10px; font-weight: 600; color: #007AFF; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; font-size: 15px; }
        .tedavi-header-sol { display: flex; align-items: center; gap: 8px; }
        .tedavi-content { display: none; padding: 15px 5px 5px 5px; }
        .tedavi-accordion.active .tedavi-content { display: block; }
        .tedavi-accordion.active .tedavi-header .tani-icon { transform: rotate(180deg); }
        
        .tedavi-blok { margin-bottom: 14px; padding-left: 12px; border-left: 4px solid #ccc; background: #F9F9FB; padding-top: 8px; padding-bottom: 8px; padding-right: 8px; border-radius: 0 8px 8px 0; }
        .tedavi-blok.border-yesil { border-left-color: #34C759; }
        .tedavi-blok.border-sari { border-left-color: #FFCC00; }
        .tedavi-blok.border-kirmizi { border-left-color: #FF3B30; }
        .tedavi-blok-baslik { font-size: 14.5px; font-weight: 700; margin-bottom: 6px; }
        .tedavi-blok.border-yesil .tedavi-blok-baslik { color: #248A3D; }
        .tedavi-blok.border-sari .tedavi-blok-baslik { color: #B28F00; }
        .tedavi-blok.border-kirmizi .tedavi-blok-baslik { color: #C93400; }
        ul.tedavi-liste { margin: 0; padding-left: 20px; font-size: 14px; color: #3A3A3C; }
        ul.tedavi-liste li { margin-bottom: 5px; }
        /* -------------------------------------------------------------- */

        .hidden { display: none !important; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 15px; font-weight: 500; }
        
        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            h1 { font-size: 24px; }
            .accordion-header { padding: 15px 18px; font-size: 16px; }
            .tani-header { padding: 12px 14px; }
            .tani-baslik { font-size: 14.5px; }
            .search-box { padding: 14px 18px; font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DSM-5</h1>
        <div class="subtitle">Klinik Tanı & Tedavi Portalı</div>
    </header>

    <div class="search-container">
        <input type="search" id="searchInput" class="search-box" autocomplete="off" placeholder="Tanı adı veya F kodu arayın...">
    </div>

    <div id="dsmContainer">
        <div class="loading">Veriler yükleniyor...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://hxahdcetnqcwzhkhqoey.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4YWhkY2V0bnFjd3poa2hxb2V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzUxNzYsImV4cCI6MjEwMzg1MTE3Nn0.6XcAk3fvN9h1nwyj2YLNSarpr9YZEGcRhwkgQRZty5A';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", () => {
        fetchDSMData();
        setupSearch();
    });

    async function fetchDSMData() {
        try {
            const { data, error } = await supabaseClient.from('dsm_kategoriler').select('*').order('id', { ascending: true });
            if (error) throw error;
            if (data && data.length > 0) renderUI(data);
        } catch (error) {
            document.getElementById('dsmContainer').innerHTML = `<div style="text-align:center; color:red;">Hata: ${error.message}</div>`;
        }
    }

    function renderUI(data) {
        const container = document.getElementById('dsmContainer');
        const fragment = document.createDocumentFragment();

        data.forEach(kategori => {
            const accItem = document.createElement('div');
            accItem.className = 'accordion-item'; 

            let tanilarHTML = '';
            
            if(kategori.tanilar && Array.isArray(kategori.tanilar)) {
                kategori.tanilar.forEach(tani => {
                    // 1. Kriterleri Oluştur
                    let kriterlerHTML = tani.kriterler.map(k => `
                        <div>
                            <div class="kriter-tanim">${k.harf !== 'Not' ? `<span class="kriter-harf">${k.harf}.</span>` : `<span class="kriter-harf">Not.</span>`} ${k.tanim}</div>
                            ${k.maddeler && k.maddeler.length > 0 ? `<ul class="kriter-liste">${k.maddeler.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}
                        </div>
                    `).join('');

                    // 2. Tedavi Şeması Varsa Oluştur
                    let tedaviHTML = '';
                    if (tani.tedavi_algoritmasi && tani.tedavi_algoritmasi.length > 0) {
                        let tedaviBloklari = tani.tedavi_algoritmasi.map(t => `
                            <div class="tedavi-blok border-${t.renk_kodu}">
                                <div class="tedavi-blok-baslik">${t.baslik}</div>
                                <ul class="tedavi-liste">
                                    ${t.maddeler.map(m => `<li>${m}</li>`).join('')}
                                </ul>
                            </div>
                        `).join('');

                        tedaviHTML = `
                            <div class="tedavi-accordion">
                                <div class="tedavi-header">
                                    <div class="tedavi-header-sol">
                                        <span style="font-size:16px;">💊</span>
                                        <span>Tedavi Algoritması</span>
                                    </div>
                                    <span class="tani-icon" style="transform: rotate(0deg);">+</span>
                                </div>
                                <div class="tedavi-content">
                                    ${tedaviBloklari}
                                </div>
                            </div>
                        `;
                    }

                    tanilarHTML += `
                        <div class="tani-card" data-search="${tani.baslik.toLowerCase()} ${tani.kod_icd10.toLowerCase()}">
                            <div class="tani-header">
                                <div class="tani-baslik-container">
                                    <h3 class="tani-baslik">${tani.baslik}</h3>
                                    <div class="kod-badge">${tani.kod_icd10}</div>
                                </div>
                                <span class="tani-icon">+</span>
                            </div>
                            <div class="tani-content">
                                ${kriterlerHTML}
                                ${tedaviHTML}
                            </div>
                        </div>
                    `;
                });
            }

            accItem.innerHTML = `
                <div class="accordion-header">
                    <span>${kategori.kategori_adi}</span>
                    <span class="accordion-icon" style="transform: rotate(0deg);">+</span>
                </div>
                <div class="accordion-content">
                    ${tanilarHTML}
                </div>
            `;
            fragment.appendChild(accItem);
        });
        
        container.innerHTML = '';
        container.appendChild(fragment);

        // Ana Kategori Açma/Kapama
        document.querySelectorAll('.accordion-header').forEach(header => {
            header.addEventListener('click', function() {
                const item = this.parentElement;
                item.classList.toggle('active');
                const icon = this.querySelector('.accordion-icon');
                icon.textContent = item.classList.contains('active') ? '−' : '+';
                icon.style.transform = item.classList.contains('active') ? 'rotate(180deg)' : 'rotate(0)';
            });
        });

        // Tanı Kartı Açma/Kapama
        document.querySelectorAll('.tani-header').forEach(header => {
            header.addEventListener('click', function(e) {
                e.stopPropagation(); 
                const card = this.parentElement;
                card.classList.toggle('active');
                const icon = this.querySelector('.tani-icon');
                icon.textContent = card.classList.contains('active') ? '−' : '+';
                icon.style.transform = card.classList.contains('active') ? 'rotate(180deg)' : 'rotate(0)';
            });
        });

        // Tedavi Akordeonu Açma/Kapama
        document.querySelectorAll('.tedavi-header').forEach(header => {
            header.addEventListener('click', function(e) {
                e.stopPropagation(); 
                const acc = this.parentElement;
                acc.classList.toggle('active');
                const icon = this.querySelector('.tani-icon');
                icon.textContent = acc.classList.contains('active') ? '−' : '+';
                icon.style.transform = acc.classList.contains('active') ? 'rotate(180deg)' : 'rotate(0)';
            });
        });
    }

    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            requestAnimationFrame(() => {
                const query = e.target.value.toLowerCase().trim();
                const accordions = document.querySelectorAll('.accordion-item');

                accordions.forEach(acc => {
                    const tanilar = acc.querySelectorAll('.tani-card');
                    let hasVisibleCard = false;

                    tanilar.forEach(card => {
                        const searchableText = card.getAttribute('data-search');
                        if (query === '') {
                            card.classList.remove('hidden', 'active');
                            card.querySelector('.tani-header .tani-icon').textContent = '+';
                            card.querySelector('.tani-header .tani-icon').style.transform = 'rotate(0deg)';
                        } else if (searchableText.includes(query)) {
                            card.classList.remove('hidden');
                            card.classList.add('active'); 
                            card.querySelector('.tani-header .tani-icon').textContent = '−';
                            card.querySelector('.tani-header .tani-icon').style.transform = 'rotate(180deg)';
                            hasVisibleCard = true;
                        } else {
                            card.classList.add('hidden');
                            card.classList.remove('active');
                            card.querySelector('.tani-header .tani-icon').textContent = '+';
                            card.querySelector('.tani-header .tani-icon').style.transform = 'rotate(0deg)';
                        }
                    });

                    if (query === '') {
                        acc.classList.remove('hidden', 'active');
                        acc.querySelector('.accordion-icon').textContent = '+';
                        acc.querySelector('.accordion-icon').style.transform = 'rotate(0deg)';
                    } else if (hasVisibleCard) {
                        acc.classList.remove('hidden');
                        acc.classList.add('active'); 
                        acc.querySelector('.accordion-icon').textContent = '−';
                        acc.querySelector('.accordion-icon').style.transform = 'rotate(180deg)';
                    } else {
                        acc.classList.add('hidden');
                        acc.classList.remove('active');
                    }
                });
            });
        });
    }
</script>
</body>
</html>
