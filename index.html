<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSM-5 Tanı Ölçütleri</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --border-color: #e9ecef;
            --text-main: #333333;
            --text-muted: #6c757d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary-color); margin-bottom: 5px; font-size: 24px; }
        
        .search-container { position: sticky; top: 10px; z-index: 100; margin-bottom: 25px; background-color: var(--bg-color); padding: 10px 0; }
        .search-box { width: 100%; padding: 16px 20px; font-size: 16px; border: 2px solid #dee2e6; border-radius: 12px; box-sizing: border-box; transition: all 0.3s ease; }
        .search-box:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 4px 12px rgba(52, 152, 219, 0.15); }
        
        .accordion-item { background: #ffffff; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); overflow: hidden; }
        .accordion-header { padding: 18px 20px; font-weight: 600; font-size: 17px; color: var(--primary-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .accordion-header:hover { background-color: #f1f3f5; }
        .accordion-content { display: none; padding: 0 20px 20px 20px; border-top: 1px solid var(--border-color); }
        .accordion-item.active .accordion-content { display: block; }
        
        .tani-card { background: #ffffff; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        .tani-card:last-child { border-bottom: none; padding-bottom: 0; }
        .tani-baslik { font-size: 18px; color: var(--primary-color); margin: 0 0 10px 0; }
        .kod-badge { background-color: #e3f2fd; color: #1976d2; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 500; display: inline-block; margin-bottom: 15px; }
        .kriter-harf { font-weight: 700; color: var(--accent-color); margin-right: 5px; }
        .kriter-tanim { font-weight: 600; margin-bottom: 8px; }
        ul.kriter-liste { margin-top: 5px; padding-left: 20px; color: #495057; }
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DSM-5 Başvuru Rehberi</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" autocomplete="off" placeholder="Tanı adı, F kodu veya belirti ara...">
    </div>

    <div id="dsmContainer">
        <div class="loading">Veriler Supabase'den yükleniyor...</div>
    </div>
</div>

<script>
    // Supabase Bağlantı Bilgileri
    const SUPABASE_URL = 'https://hxahdcetnqcwzhkhqoey.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4YWhkY2V0bnFjd3poa2hxb2V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzUxNzYsImV4cCI6MjEwMzg1MTE3Nn0.6XcAk3fvN9h1nwyj2YLNSarpr9YZEGcRhwkgQRZty5A';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", () => {
        fetchDSMData();
        setupSearch();
    });

    // Supabase'den Veri Çekme
    async function fetchDSMData() {
        try {
            const { data, error } = await supabase
                .from('dsm_kategoriler')
                .select('*')
                .order('id', { ascending: true });

            if (error) throw error;
            
            if (data && data.length > 0) {
                renderUI(data);
            } else {
                document.getElementById('dsmContainer').innerHTML = '<div class="loading">Henüz veri eklenmemiş. Lütfen Supabase üzerinden verileri girin.</div>';
            }
        } catch (error) {
            console.error('Veri çekme hatası:', error.message);
            document.getElementById('dsmContainer').innerHTML = `<div class="loading" style="color: red;">Veri yüklenirken hata oluştu: ${error.message}</div>`;
        }
    }

    // Arayüzü Çizme Fonksiyonu
    function renderUI(data) {
        const container = document.getElementById('dsmContainer');
        container.innerHTML = '';

        data.forEach(kategori => {
            const accItem = document.createElement('div');
            accItem.className = 'accordion-item';

            let tanilarHTML = '';
            
            if(kategori.tanilar && Array.isArray(kategori.tanilar)) {
                kategori.tanilar.forEach(tani => {
                    let kriterlerHTML = tani.kriterler.map(k => `
                        <div style="margin-bottom: 12px;">
                            <div class="kriter-tanim"><span class="kriter-harf">${k.harf}.</span> ${k.tanim}</div>
                            ${k.maddeler && k.maddeler.length > 0 ? `<ul class="kriter-liste">${k.maddeler.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}
                        </div>
                    `).join('');

                    tanilarHTML += `
                        <div class="tani-card" data-search="${tani.baslik.toLowerCase()} ${tani.kod_icd10.toLowerCase()}">
                            <h3 class="tani-baslik">${tani.baslik}</h3>
                            <div class="kod-badge">ICD-10: ${tani.kod_icd10}</div>
                            <div class="kriter-icerik">${kriterlerHTML}</div>
                        </div>
                    `;
                });
            }

            accItem.innerHTML = `
                <div class="accordion-header">
                    <span>${kategori.kategori_adi}</span>
                    <span class="accordion-icon">+</span>
                </div>
                <div class="accordion-content">
                    ${tanilarHTML}
                </div>
            `;
            container.appendChild(accItem);
        });

        document.querySelectorAll('.accordion-header').forEach(header => {
            header.addEventListener('click', function() {
                const item = this.parentElement;
                item.classList.toggle('active');
                const icon = this.querySelector('.accordion-icon');
                icon.textContent = item.classList.contains('active') ? '×' : '+';
                icon.style.transform = item.classList.contains('active') ? 'rotate(90deg)' : 'rotate(0)';
            });
        });
    }

    // Arama Mantığı
    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const accordions = document.querySelectorAll('.accordion-item');

            accordions.forEach(acc => {
                const tanilar = acc.querySelectorAll('.tani-card');
                let hasVisibleCard = false;

                tanilar.forEach(card => {
                    const searchableText = card.getAttribute('data-search') + " " + card.innerText.toLowerCase();
                    if (searchableText.includes(query)) {
                        card.classList.remove('hidden');
                        hasVisibleCard = true;
                    } else {
                        card.classList.add('hidden');
                    }
                });

                if (hasVisibleCard) {
                    acc.classList.remove('hidden');
                    if (query.length > 0) {
                        acc.classList.add('active');
                        acc.querySelector('.accordion-icon').textContent = '×';
                        acc.querySelector('.accordion-icon').style.transform = 'rotate(90deg)';
                    }
                } else {
                    acc.classList.add('hidden');
                    acc.classList.remove('active');
                }
            });

            if (query === '') {
                accordions.forEach(acc => {
                    acc.classList.remove('hidden', 'active');
                    acc.querySelector('.accordion-icon').textContent = '+';
                    acc.querySelector('.accordion-icon').style.transform = 'rotate(0)';
                    acc.querySelectorAll('.tani-card').forEach(c => c.classList.remove('hidden'));
                });
            }
        });
    }
</script>
</body>
</html>
